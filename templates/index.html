<!DOCTYPE html>
<html>

<head>

<title>PPT Generator</title>

<style>

body{
    font-family:Arial;
    margin:50px;
}

.container{
    width:500px;
    margin:auto;
    padding:20px;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

</style>

</head>

<body>

<div class="container">

<h2>Railway Board PPT Generator</h2>

<form
action="/run"
method="post"
enctype="multipart/form-data">

<p>Select Excel File</p>

<input
type="file"
name="excel_file"
accept=".xlsx,.xls"
required>

<br><br>

<button type="submit">
Generate All PPT Reports
</button>

</form>

</div>

</body>
</html>
